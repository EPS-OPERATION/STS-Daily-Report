name: CI

on:
  push:
    branches: [dev, "refactor/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sts
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d sts"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WEATHER_CRON: "false"
      # Some tests import modules that read the API env at load time (e.g. weather.cron); point them at the service DB.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sts
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x
      - run: bun install --frozen-lockfile
      - run: bun typecheck
      - run: bun test
      - run: bun check:arch
      - run: bun run build
      - name: Migrate and seed an empty database
        run: |
          cp .env.example .env
          bun db:migrate
          SEED_DEMO=false bun db:seed
      - name: API behaviour snapshot (golden file)
        working-directory: apps/api
        run: bun --env-file=../../.env scripts/snapshot-daily-reports.ts test/golden/daily-reports.snapshot.json --check

  # Staging CD: only after every check above passes on a push to dev.
  # Order matters: migrate Supabase first, then build the new code on Vercel (vercel.json turns off Vercel's own
  # automatic deploys for dev, so the Deploy Hook below is the only way dev reaches staging).
  # Secrets (repo → Settings → Secrets and variables → Actions):
  #   MIGRATE_DATABASE_URL   Supabase session pooler URL (:5432)
  #   VERCEL_DEPLOY_HOOK_URL Vercel → Settings → Git → Deploy Hooks (branch dev)
  deploy-staging:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    env:
      MIGRATE_DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
    steps:
      - name: Check deploy secrets
        run: |
          missing=""
          [ -n "$MIGRATE_DATABASE_URL" ] || missing="$missing MIGRATE_DATABASE_URL"
          [ -n "$VERCEL_DEPLOY_HOOK_URL" ] || missing="$missing VERCEL_DEPLOY_HOOK_URL"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.x
      - run: bun install --frozen-lockfile
      - name: Migrate Supabase (already-applied migrations are skipped)
        working-directory: apps/api
        env:
          DATABASE_URL: ${{ secrets.MIGRATE_DATABASE_URL }}
          WEATHER_CRON: "false"
        run: bun src/db/migrate.ts
      - name: Deploy to Vercel
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL" > /dev/null && echo "Vercel deploy started"
